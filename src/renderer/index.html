<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shadow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="hud" id="hud">
        <span class="dot" id="dot"></span>
        <div class="text">
          <div class="title">SHADOW</div>
          <div class="status" id="status">watching</div>
        </div>
        <div class="meter" id="meter">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <button class="mute" id="mute" title="Mute mic" aria-label="Mute microphone">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
          </svg>
          <svg class="slash" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
        </button>
      </div>

      <div class="live">
        <div class="live-row"><span class="ico">👁</span><span id="live-screen">—</span></div>
        <div class="live-row"><span class="ico">🎙</span><span id="live-voice">—</span></div>
      </div>

      <div class="profile">
        <div class="section-title">YOUR PROFILE</div>
        <div id="profile-bars"></div>
        <div class="profile-meta">
          <span>confidence: <b id="conf">0%</b></span>
          <span>signals: <b id="sig-count">0</b></span>
        </div>
      </div>

      <div class="suggestions">
        <div class="section-title">SHADOW THINKS YOU WANT TO:</div>
        <div id="suggestion-list"></div>
      </div>

      <div class="artifacts">
        <div class="section-title">TODAY'S ARTIFACTS</div>
        <div id="artifact-list"></div>
      </div>

      <div class="dropzone" id="dropzone">drop a file here</div>
    </div>

    <div class="card-overlay" id="card-overlay">
      <div class="card-wrap">
        <div class="card-close" id="card-close">×</div>
        <div id="card-body"></div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
